name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch pinned Hermes base for the plugin runtime imports
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes
          git -C /tmp/hermes fetch --depth 1 origin 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          git -C /tmp/hermes checkout FETCH_HEAD
          echo "HERMES_SRC=/tmp/hermes" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest ruamel.yaml pyyaml

      - name: Run tests (disposable HERMES_HOME; pre-fix core from PREFIX_CORE or the shipped fixture)
        run: ./run_tests.sh
