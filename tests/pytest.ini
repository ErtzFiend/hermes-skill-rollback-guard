# The repo root is the plugin package (it holds __init__.py, required by the Hermes loader).
# Running pytest with the repo root as rootdir makes pytest import that package as a test
# package. Pointing pytest at the tests dir (this file makes it the rootdir) avoids that.
# Run with:  python -m pytest tests      (or ./run_tests.sh)
[pytest]
addopts = -q --import-mode=importlib
